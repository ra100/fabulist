# Version updates for everything this repository pins: the npm lockfile, the
# digest-pinned base images in the Dockerfile, the bundled Postgres in the
# deploy compose file, and the GitHub Actions the workflows use. Security
# alerts and security updates are repository settings, not this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch bumps travel together; each major gets its own PR, because a
    # major is a migration (zod 3 to 4 broke the typecheck) and one of them must
    # not hold up every routine update in the group.
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
