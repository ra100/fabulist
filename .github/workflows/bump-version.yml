name: Bump version after merge

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  actions: write
  contents: write

concurrency:
  group: main-version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Choose release increment from Conventional Commits
        id: increment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          messages="$(mktemp)"
          trap 'rm -f "$messages"' EXIT
          git log --format=%B "$BASE_SHA..$MERGE_SHA" > "$messages"

          # Conventional Commits maps BREAKING CHANGE to major, feat to minor,
          # and fix/perf to patch. Other types intentionally do not release.
          if grep -Eiq '^[a-z]+(\([^)]+\))?!:' "$messages" \
            || grep -Eiq '^BREAKING[ -]CHANGE:' "$messages"; then
            echo "value=major" >> "$GITHUB_OUTPUT"
          elif grep -Eq '^feat(\([^)]+\))?:' "$messages"; then
            echo "value=minor" >> "$GITHUB_OUTPUT"
          elif grep -Eq '^(fix|perf)(\([^)]+\))?:' "$messages"; then
            echo "value=patch" >> "$GITHUB_OUTPUT"
          else
            echo "value=none" >> "$GITHUB_OUTPUT"
            echo "No release: no release-relevant Conventional Commit in $BASE_SHA..$MERGE_SHA"
          fi

      - name: Bump, commit, tag, and push (retrying on a racing merge)
        id: version
        if: steps.increment.outputs.value != 'none'
        env:
          INCREMENT: ${{ steps.increment.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The `concurrency` group above only serializes the common case.
          # Two PRs merged within the same instant can still leave this job's
          # checkout stale by the time it pushes (observed: both jobs bump
          # from the same base version and race to push/tag `vX.Y.Z`, and the
          # loser fails with "tag already exists" or a rejected push). So
          # re-sync to the tip of `main` and recompute the version from *that*
          # right before each attempt, instead of trusting the checkout made
          # at job start.
          attempt=1
          max_attempts=5
          while true; do
            git fetch origin main
            git reset --hard origin/main

            pnpm version "$INCREMENT" --no-git-tag-version
            version="$(node -p "require('./package.json').version")"

            git add package.json pnpm-lock.yaml
            git commit -m "chore(release): bump version to $version"
            git tag -a "v$version" -m "Release v$version"

            if git push origin main "v$version"; then
              echo "value=$version" >> "$GITHUB_OUTPUT"
              break
            fi

            git tag -d "v$version"
            git reset --hard HEAD~1

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Giving up after $attempt attempts racing another merge's version bump" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep "$(( (RANDOM % 5) + 1 ))"
          done

      - name: Start deployment for the release tag
        if: steps.increment.outputs.value != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh workflow run release.yml --ref "v$VERSION"
