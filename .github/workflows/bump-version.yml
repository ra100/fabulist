name: Bump version after merge

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  actions: write
  contents: write

concurrency:
  group: main-version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Choose release increment from Conventional Commits
        id: increment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          messages="$(mktemp)"
          trap 'rm -f "$messages"' EXIT
          git log --format=%B "$BASE_SHA..$MERGE_SHA" > "$messages"

          # Conventional Commits maps BREAKING CHANGE to major, feat to minor,
          # and fix/perf to patch. Other types intentionally do not release.
          if grep -Eiq '^[a-z]+(\([^)]+\))?!:' "$messages" \
            || grep -Eiq '^BREAKING[ -]CHANGE:' "$messages"; then
            echo "value=major" >> "$GITHUB_OUTPUT"
          elif grep -Eq '^feat(\([^)]+\))?:' "$messages"; then
            echo "value=minor" >> "$GITHUB_OUTPUT"
          elif grep -Eq '^(fix|perf)(\([^)]+\))?:' "$messages"; then
            echo "value=patch" >> "$GITHUB_OUTPUT"
          else
            echo "value=none" >> "$GITHUB_OUTPUT"
            echo "No release: no release-relevant Conventional Commit in $BASE_SHA..$MERGE_SHA"
          fi

      - name: Update package version
        id: version
        if: steps.increment.outputs.value != 'none'
        run: |
          set -euo pipefail
          pnpm version "${{ steps.increment.outputs.value }}" --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag release
        if: steps.increment.outputs.value != 'none'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(release): bump version to $VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin main "v$VERSION"

      - name: Start deployment for the release tag
        if: steps.increment.outputs.value != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh workflow run release.yml --ref "v$VERSION"
