name: release

# Publishes to Docker Hub and deploys to the VPS on a version tag — nothing
# runs on an ordinary push to main, so a release is a deliberate `git tag
# vX.Y.Z && git push --tags`, not a side effect of merging.
#
# No npm job: `npm publish` from CI needs either a fully non-interactive
# Automation token or an OTP prompt neither this workflow nor a headless
# runner can answer. Publish to npm by hand (`pnpm build:web && npm publish
# --access public`) from a machine that can supply the OTP, until/unless an
# Automation token replaces NPM_ACCESS_TOKEN.
on:
  push:
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ra100
          password: ${{ secrets.DOCKER_TOKEN }}

      # The tag that triggered this becomes the image tag as-is — pushing
      # `v0.1.0` tags the image `ra100/fabulist:v0.1.0` (github.ref_name keeps
      # the `v`, it only strips the leading `refs/tags/`) — alongside a
      # floating `latest`.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ra100/fabulist:latest
            ra100/fabulist:${{ github.ref_name }}

  # Runs only after the image above is actually on Docker Hub — deploying
  # before the push lands would pull the previous tag under a new name and
  # look like a successful no-op release.
  #
  # Deploy works in both SSH-key modes:
  #
  #   unrestricted key      — the runner can scp deploy files and run explicit commands.
  #   forced-command key    — sshd always runs deploy.sh and passes the client request
  #                           through $SSH_ORIGINAL_COMMAND; scp/chmod are rejected.
  #
  # Script sync is therefore best-effort: keep it when available, but do not fail deploy
  # when the key is intentionally restricted.
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync deploy scripts, render app.env, and deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_DOMAIN: ${{ vars.SSH_DOMAIN }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          MCP_OAUTH_ISSUER: ${{ vars.MCP_OAUTH_ISSUER }}
          MCP_OAUTH_AUDIENCE: ${{ vars.MCP_OAUTH_AUDIENCE }}
          MCP_RESOURCE_URL: ${{ vars.MCP_RESOURCE_URL }}
          AUTH_REQUIRE_LOGIN: ${{ vars.AUTH_REQUIRE_LOGIN }}
          AUTH_ADMIN_EMAILS: ${{ vars.AUTH_ADMIN_EMAILS }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
          WORKOS_COOKIE_PASSWORD: ${{ secrets.WORKOS_COOKIE_PASSWORD }}
          # Which Postgres the deployed stack uses. Two supported shapes:
          #
          #   bundled  — set COMPOSE_PROFILES=bundled and POSTGRES_PASSWORD. The
          #              database runs as part of the stack, its data in a bind mount
          #              on the host disk, and FABULIST_PG can be left unset:
          #              docker-compose.yml already defaults it to that service.
          #   external — set FABULIST_PG to the full connection string for a Postgres
          #              you manage. Leave COMPOSE_PROFILES unset.
          #
          # All three are skipped when unset, so an instance configured neither way
          # boots and says it cannot reach a database rather than guessing.
          COMPOSE_PROFILES: ${{ vars.COMPOSE_PROFILES }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FABULIST_PG: ${{ secrets.FABULIST_PG }}
        run: |
          set -euo pipefail
          install -m 600 -D /dev/null "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$SSH_PORT" "$SSH_DOMAIN" >> "$HOME/.ssh/known_hosts" 2>/dev/null

          # Falls back to the path every other deploy/ doc assumes, so this
          # keeps working even before DEPLOY_PATH is set as a repo variable.
          deploy_path="${DEPLOY_PATH:-/home/ra100/Development/fabulist}"

          # Best-effort sync for unrestricted keys. A command-restricted key cannot
          # run scp/chmod by design; in that shape we rely on the already-installed
          # deploy.sh on the VPS.
          if scp -i "$HOME/.ssh/deploy_key" -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
               deploy/deploy.sh deploy/docker-compose.yml \
               "$SSH_USER@$SSH_DOMAIN:$deploy_path/"; then
            if ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
                 "$SSH_USER@$SSH_DOMAIN" "chmod +x $deploy_path/deploy.sh"; then
              echo "deploy scripts synced on VPS"
            else
              echo "note: deploy script sync succeeded, but chmod was rejected by server policy" >&2
            fi
          else
            echo "note: deploy script sync skipped (SSH key appears command-restricted)" >&2
          fi

          # Some of these are real secrets now (WORKOS_API_KEY,
          # WORKOS_COOKIE_PASSWORD, for src/auth/config.ts's web login
          # feature), not just public config like the MCP_* vars below — the
          # `secrets.*`/`vars.*` split in the `env:` block above is what
          # actually matters for GitHub's own masking in logs; this list just
          # controls what reaches app.env. Skips any left unset entirely
          # rather than writing e.g. "AUTH_REQUIRE_LOGIN=" — an
          # empty-but-present value would make resolveAuthConfig() try to
          # turn login on with a blank flag instead of correctly treating it
          # as "not configured", and equivalently for buildMcpAuth().
          #
          # AUTH_ADMIN_EMAILS is in the list because the admin gate added in
          # f1089e8 fails closed: an empty allowlist means *nobody* is an
          # admin, so shipping that gate with no way to populate this variable
          # would have left the live instance's shared settings — LLM profile,
          # API keys, blocklist, re-ingest — unreachable by everyone, with no
          # route back from inside the app. Skipped like the rest when unset,
          # which is still the safe direction; it just becomes possible to set.
          render_env() {
            for name in MCP_OAUTH_ISSUER MCP_OAUTH_AUDIENCE MCP_RESOURCE_URL \
                        AUTH_REQUIRE_LOGIN AUTH_ADMIN_EMAILS \
                        WORKOS_API_KEY WORKOS_CLIENT_ID WORKOS_COOKIE_PASSWORD \
                        FABULIST_PG POSTGRES_PASSWORD COMPOSE_PROFILES; do
              value="${!name:-}"
              [ -n "$value" ] && printf '%s=%s\n' "$name" "$value"
            done
            # The database URL is passed through as a variable rather than
            # assembled here.
            #
            # An earlier version derived it as
            # `postgres://fabulist:$POSTGRES_PASSWORD@postgres:5432/fabulist` — the
            # *container* Postgres. That is wrong for this deployment: the VPS has
            # its own Postgres, and the bundled one is now an opt-in
            # `--profile bundled` for local runs (see docker-compose.yml). Deriving
            # it also silently decided the host, port, database and role, none of
            # which this workflow can know.
            #
            # `host.docker.internal` is the hostname to use for a Postgres on the
            # VPS itself — docker-compose.yml maps it to `host-gateway`, since the
            # container's own `localhost` is not the host's. So a typical value is
            #   postgres://fabulist:pw@host.docker.internal:5432/fabulist
            #
            # Skipped when unset, like everything above, and `serve-pg` then exits
            # at boot naming the variable rather than silently trying localhost.
            # Without this, `[ -n "$value" ]` on the *last* unset variable in
            # the loop returns 1, which becomes render_env's own exit code —
            # and `set -e` upstream would then fail the whole step on the
            # exact case this function exists to handle gracefully (a var
            # that's legitimately not configured). Verified this actually
            # reproduces before adding the fix, not assumed.
            return 0
          }

          # Try path-form first (works with unrestricted keys), then bare action
          # (works with forced-command setups whose server parser expects only
          # SSH_ORIGINAL_COMMAND=upload-env/deploy).
          env_payload="$(render_env)"
          if ! printf '%s\n' "$env_payload" | ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
               "$SSH_USER@$SSH_DOMAIN" "$deploy_path/deploy.sh upload-env"; then
            echo "note: path-form upload-env failed; retrying bare action" >&2
            printf '%s\n' "$env_payload" | ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_DOMAIN" "upload-env"
          fi

          if ! ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
               "$SSH_USER@$SSH_DOMAIN" "$deploy_path/deploy.sh deploy"; then
            echo "note: path-form deploy failed; retrying bare action" >&2
            ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_DOMAIN" "deploy"
          fi
