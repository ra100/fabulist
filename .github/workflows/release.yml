name: release

# Publishes to npm and Docker Hub on a version tag — nothing runs on an
# ordinary push to main, so a release is a deliberate `git tag vX.Y.Z && git
# push --tags`, not a side effect of merging.
on:
  push:
    tags:
      - 'v*'

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # --frozen-lockfile: a release must build from exactly what's committed,
      # never a lockfile pnpm decided to update on the runner.
      - run: pnpm install --frozen-lockfile

      # Explicit here even though `prepublishOnly` also runs it, so a failed
      # build fails this step with a clear name instead of failing inside
      # `npm publish`'s own lifecycle-hook output.
      - run: pnpm build:web

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ra100
          password: ${{ secrets.DOCKER_TOKEN }}

      # The tag that triggered this becomes the image tag as-is — pushing
      # `v0.1.0` tags the image `ra100/fabulist:v0.1.0` (github.ref_name keeps
      # the `v`, it only strips the leading `refs/tags/`) — alongside a
      # floating `latest`.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ra100/fabulist:latest
            ra100/fabulist:${{ github.ref_name }}
