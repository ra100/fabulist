name: release

# Publishes to Docker Hub and deploys to the VPS on a version tag — nothing
# runs on an ordinary push to main, so a release is a deliberate `git tag
# vX.Y.Z && git push --tags`, not a side effect of merging.
#
# No npm job: `npm publish` from CI needs either a fully non-interactive
# Automation token or an OTP prompt neither this workflow nor a headless
# runner can answer. Publish to npm by hand (`pnpm build:web && npm publish
# --access public`) from a machine that can supply the OTP, until/unless an
# Automation token replaces NPM_ACCESS_TOKEN.
on:
  push:
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ra100
          password: ${{ secrets.DOCKER_TOKEN }}

      # The tag that triggered this becomes the image tag as-is — pushing
      # `v0.1.0` tags the image `ra100/fabulist:v0.1.0` (github.ref_name keeps
      # the `v`, it only strips the leading `refs/tags/`) — alongside a
      # floating `latest`.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ra100/fabulist:latest
            ra100/fabulist:${{ github.ref_name }}

  # Runs only after the image above is actually on Docker Hub — deploying
  # before the push lands would pull the previous tag under a new name and
  # look like a successful no-op release.
  #
  # Every deploy/ file the VPS needs (deploy.sh, docker-compose.yml) is
  # scp'd fresh from this checkout before anything else runs — the VPS is
  # never the source of truth for its own deploy scripts, only a target this
  # job overwrites every time. This closes a real gap: v0.2.2's deploy.sh fix
  # was committed here but never reached the VPS, because nothing re-synced
  # it after the one-time vps-setup.sh copy — the "successful" v0.2.2 deploy
  # run was silently still executing the *old* deploy.sh the whole time.
  #
  # Invokes deploy.sh by its real path with a real argument (upload-env /
  # deploy), rather than an authorized_keys `command=` forced command read
  # back out of $SSH_ORIGINAL_COMMAND. That was the original design, but it
  # never actually worked: the `command=` restriction was never added to
  # this key's authorized_keys line, so sshd ran the account's own login
  # shell (fish) on the literal string "upload-env" instead of deploy.sh —
  # confirmed directly from a failed run's own logs ("fish: Unknown command:
  # upload-env"), not guessed at.
  #
  # SECURITY NOTE: without that `command=` restriction in place, this key
  # can run *any* SSH command on the box, not just these actions —
  # deploy/README.md documents the exact authorized_keys line to add when
  # there's time to restore that restriction. Tracked as a known gap, not
  # silently dropped.
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync deploy scripts, render app.env, and deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_DOMAIN: ${{ vars.SSH_DOMAIN }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          MCP_OAUTH_ISSUER: ${{ vars.MCP_OAUTH_ISSUER }}
          MCP_OAUTH_AUDIENCE: ${{ vars.MCP_OAUTH_AUDIENCE }}
          MCP_RESOURCE_URL: ${{ vars.MCP_RESOURCE_URL }}
          AUTH_REQUIRE_LOGIN: ${{ vars.AUTH_REQUIRE_LOGIN }}
          AUTH_ADMIN_EMAILS: ${{ vars.AUTH_ADMIN_EMAILS }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
          WORKOS_COOKIE_PASSWORD: ${{ secrets.WORKOS_COOKIE_PASSWORD }}
          # A real secret: it is the database password, and `render_env` also
          # derives FABULIST_PG from it. Unset means the deployed instance has no
          # database configured, and `serve-pg` says so at boot rather than
          # silently trying localhost.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          install -m 600 -D /dev/null "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$SSH_PORT" "$SSH_DOMAIN" >> "$HOME/.ssh/known_hosts" 2>/dev/null

          # Falls back to the path every other deploy/ doc assumes, so this
          # keeps working even before DEPLOY_PATH is set as a repo variable.
          deploy_path="${DEPLOY_PATH:-/home/ra100/Development/fabulist}"

          scp -i "$HOME/.ssh/deploy_key" -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            deploy/deploy.sh deploy/docker-compose.yml \
            "$SSH_USER@$SSH_DOMAIN:$deploy_path/"

          ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_DOMAIN" "chmod +x $deploy_path/deploy.sh"

          # Some of these are real secrets now (WORKOS_API_KEY,
          # WORKOS_COOKIE_PASSWORD, for src/auth/config.ts's web login
          # feature), not just public config like the MCP_* vars below — the
          # `secrets.*`/`vars.*` split in the `env:` block above is what
          # actually matters for GitHub's own masking in logs; this list just
          # controls what reaches app.env. Skips any left unset entirely
          # rather than writing e.g. "AUTH_REQUIRE_LOGIN=" — an
          # empty-but-present value would make resolveAuthConfig() try to
          # turn login on with a blank flag instead of correctly treating it
          # as "not configured", and equivalently for buildMcpAuth().
          #
          # AUTH_ADMIN_EMAILS is in the list because the admin gate added in
          # f1089e8 fails closed: an empty allowlist means *nobody* is an
          # admin, so shipping that gate with no way to populate this variable
          # would have left the live instance's shared settings — LLM profile,
          # API keys, blocklist, re-ingest — unreachable by everyone, with no
          # route back from inside the app. Skipped like the rest when unset,
          # which is still the safe direction; it just becomes possible to set.
          render_env() {
            for name in MCP_OAUTH_ISSUER MCP_OAUTH_AUDIENCE MCP_RESOURCE_URL \
                        AUTH_REQUIRE_LOGIN AUTH_ADMIN_EMAILS \
                        WORKOS_API_KEY WORKOS_CLIENT_ID WORKOS_COOKIE_PASSWORD \
                        POSTGRES_PASSWORD; do
              value="${!name:-}"
              [ -n "$value" ] && printf '%s=%s\n' "$name" "$value"
            done
            # The app's connection string, derived rather than configured
            # separately. Two variables that have to agree about one password is
            # a way to have them disagree: `postgres` is the compose service
            # name, resolved on the compose network, and the database and user
            # are fixed by docker-compose.yml's own `environment:` block.
            #
            # Skipped entirely when POSTGRES_PASSWORD is unset, like everything
            # above — and then `serve-pg` exits at boot with a clear message
            # about setting FABULIST_PG rather than silently trying localhost.
            [ -n "${POSTGRES_PASSWORD:-}" ] \
              && printf 'FABULIST_PG=postgres://fabulist:%s@postgres:5432/fabulist\n' "$POSTGRES_PASSWORD"
            # Without this, `[ -n "$value" ]` on the *last* unset variable in
            # the loop returns 1, which becomes render_env's own exit code —
            # and `set -e` upstream would then fail the whole step on the
            # exact case this function exists to handle gracefully (a var
            # that's legitimately not configured). Verified this actually
            # reproduces before adding the fix, not assumed.
            return 0
          }

          render_env | ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_DOMAIN" "$deploy_path/deploy.sh upload-env"

          ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_DOMAIN" "$deploy_path/deploy.sh deploy"
