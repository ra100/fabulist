name: release

# Publishes to Docker Hub and deploys to the VPS on a version tag — nothing
# runs on an ordinary push to main, so a release is a deliberate `git tag
# vX.Y.Z && git push --tags`, not a side effect of merging.
#
# No npm job: `npm publish` from CI needs either a fully non-interactive
# Automation token or an OTP prompt neither this workflow nor a headless
# runner can answer. Publish to npm by hand (`pnpm build:web && npm publish
# --access public`) from a machine that can supply the OTP, until/unless an
# Automation token replaces NPM_ACCESS_TOKEN.
on:
  push:
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ra100
          password: ${{ secrets.DOCKER_TOKEN }}

      # The tag that triggered this becomes the image tag as-is — pushing
      # `v0.1.0` tags the image `ra100/fabulist:v0.1.0` (github.ref_name keeps
      # the `v`, it only strips the leading `refs/tags/`) — alongside a
      # floating `latest`.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ra100/fabulist:latest
            ra100/fabulist:${{ github.ref_name }}

  # Runs only after the image above is actually on Docker Hub — deploying
  # before the push lands would pull the previous tag under a new name and
  # look like a successful no-op release.
  #
  # Invokes deploy/deploy.sh on the VPS by its real path with a real
  # argument (upload-env / deploy), rather than relying on an
  # authorized_keys `command=` forced command read back out of
  # $SSH_ORIGINAL_COMMAND. That was the original design (see git history),
  # but it silently never worked: the `command=` restriction was never
  # actually added to this key's authorized_keys line, so sshd ran the
  # account's own login shell (fish) on the literal string "upload-env"
  # instead of deploy.sh — confirmed directly from the failed run's own
  # logs ("fish: Unknown command: upload-env"), not guessed at.
  #
  # SECURITY NOTE: without that `command=` restriction in place, this key
  # can run *any* SSH command on the box, not just these two actions —
  # deploy/README.md documents the exact authorized_keys line to add when
  # there's time to restore that restriction and switch this back to
  # $SSH_ORIGINAL_COMMAND. Tracked as a known gap, not silently dropped.
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Render app.env and deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_DOMAIN: ${{ vars.SSH_DOMAIN }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          MCP_OAUTH_ISSUER: ${{ vars.MCP_OAUTH_ISSUER }}
          MCP_OAUTH_AUDIENCE: ${{ vars.MCP_OAUTH_AUDIENCE }}
          MCP_RESOURCE_URL: ${{ vars.MCP_RESOURCE_URL }}
        run: |
          set -euo pipefail
          install -m 600 -D /dev/null "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$SSH_PORT" "$SSH_DOMAIN" >> "$HOME/.ssh/known_hosts" 2>/dev/null

          # Falls back to the path every other deploy/ doc assumes, so this
          # keeps working even before DEPLOY_PATH is set as a repo variable.
          deploy_path="${DEPLOY_PATH:-/home/ra100/Development/fabulist}"

          # Non-secret only, by construction: every value here is a repo
          # *variable* (vars.*), never a secret — WorkOS's own API key never
          # leaves GitHub, only the public issuer/audience/resource-url the
          # running server needs to verify a bearer token against, per
          # src/mcp/auth.ts. Skips any var left unset entirely rather than
          # writing e.g. "MCP_OAUTH_ISSUER=" — an empty-but-present value
          # would make buildMcpAuth() try OAuth mode with a blank issuer
          # instead of correctly treating it as "not configured".
          render_env() {
            for name in MCP_OAUTH_ISSUER MCP_OAUTH_AUDIENCE MCP_RESOURCE_URL; do
              value="${!name:-}"
              [ -n "$value" ] && printf '%s=%s\n' "$name" "$value"
            done
            # Without this, `[ -n "$value" ]` on the *last* unset variable in
            # the loop returns 1, which becomes render_env's own exit code —
            # and `set -e` upstream would then fail the whole step on the
            # exact case this function exists to handle gracefully (a var
            # that's legitimately not configured). Verified this actually
            # reproduces before adding the fix, not assumed.
            return 0
          }

          render_env | ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_DOMAIN" "$deploy_path/deploy.sh upload-env"

          ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_DOMAIN" "$deploy_path/deploy.sh deploy"
