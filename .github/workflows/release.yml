name: release

# Publishes to npm and Docker Hub on a version tag — nothing runs on an
# ordinary push to main, so a release is a deliberate `git tag vX.Y.Z && git
# push --tags`, not a side effect of merging.
on:
  push:
    tags:
      - 'v*'

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # --frozen-lockfile: a release must build from exactly what's committed,
      # never a lockfile pnpm decided to update on the runner.
      - run: pnpm install --frozen-lockfile

      # Explicit here even though `prepublishOnly` also runs it, so a failed
      # build fails this step with a clear name instead of failing inside
      # `npm publish`'s own lifecycle-hook output.
      - run: pnpm build:web

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ra100
          password: ${{ secrets.DOCKER_TOKEN }}

      # The tag that triggered this becomes the image tag as-is — pushing
      # `v0.1.0` tags the image `ra100/fabulist:v0.1.0` (github.ref_name keeps
      # the `v`, it only strips the leading `refs/tags/`) — alongside a
      # floating `latest`.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ra100/fabulist:latest
            ra100/fabulist:${{ github.ref_name }}

  # Runs only after the image above is actually on Docker Hub — deploying
  # before the push lands would pull the previous tag under a new name and
  # look like a successful no-op release.
  #
  # The VPS side of this trusts nothing about *what* SSH asks it to run: the
  # deploy key's `authorized_keys` entry carries a forced `command=` (see
  # deploy/README.md), so this step's actual ssh command is a formality —
  # the server always runs deploy/deploy.sh regardless, and that key can do
  # nothing else on the box even if it leaked.
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH (forced remote command)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_DOMAIN: ${{ vars.SSH_DOMAIN }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          set -euo pipefail
          install -m 600 -D /dev/null "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$SSH_PORT" "$SSH_DOMAIN" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          # The string passed here is irrelevant when the key's
          # authorized_keys entry carries a forced `command=` — sshd runs
          # that fixed command regardless of what the client asks for. Kept
          # non-empty and descriptive only for readable server-side logs.
          ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_DOMAIN" "deploy fabulist ${{ github.ref_name }}"
