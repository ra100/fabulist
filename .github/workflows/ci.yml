name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fabulist_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fabulist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FABULIST_TEST_PG: postgres://postgres:postgres@127.0.0.1:5432/fabulist_test
      FABULIST_REQUIRE_TEST_PG: '1'
      FABULIST_TEST_PG_SCALE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:web
      - run: pnpm test
