name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:web

  # The suite is ~99 files, each already its own `node --test` process with its
  # own throwaway database schema, so the files are independent and splitting
  # them across runners is free correctness-wise. Measured on one 4-vCPU
  # runner the whole step took 171s and was CPU-bound from start to finish —
  # raising `--test-concurrency` from 3 to 10 moved it by 5%, because four
  # cores were already saturated. More runners is the only thing that moves it.
  #
  # Shards are round-robin over the file list, which spreads the expensive
  # `pg-*` files rather than giving one shard all of them. Nothing is skipped
  # and nothing is excluded: shard N of M runs file i for every i where
  # i % M == N, so the six shards together are exactly `pnpm test`.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fabulist_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fabulist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FABULIST_TEST_PG: postgres://postgres:postgres@127.0.0.1:5432/fabulist_test
      FABULIST_REQUIRE_TEST_PG: '1'
      FABULIST_TEST_PG_SCALE: '1'
      # `node --test` runs every file in its own process, so the same ~100-file
      # TypeScript module graph was compiled from scratch for each one. The
      # compile cache is shared by all of them. Kept out of the repo — the
      # runner is thrown away afterwards.
      NODE_COMPILE_CACHE: /tmp/fabulist-node-compile-cache
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # This Postgres is created for one run and thrown away, so durability buys
      # the suite nothing. `withPg` builds a fresh throwaway schema per test, so
      # the WAL sync settings are on the hot path for hundreds of create/drop
      # cycles. All three are `sighup`/`user` settings, so `ALTER SYSTEM` plus a
      # reload applies them to the running server without restarting it. Nothing
      # observable changes: same rows, same queries, same assertions.
      - name: turn off WAL sync for the throwaway test database
        run: |
          set -euo pipefail
          psql "$FABULIST_TEST_PG" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER SYSTEM SET fsync = off;
          ALTER SYSTEM SET full_page_writes = off;
          ALTER SYSTEM SET synchronous_commit = off;
          SELECT pg_reload_conf();
          SQL
          psql "$FABULIST_TEST_PG" -Atc \
            "SELECT name || '=' || setting FROM pg_settings WHERE name IN ('fsync','full_page_writes','synchronous_commit') ORDER BY name"

      - name: run test shard ${{ matrix.shard }}/6
        run: |
          set -euo pipefail
          mapfile -t files < <(ls test/*.test.ts | awk -v s="${{ matrix.shard }}" -v n=6 'NR % n == s')
          echo "shard ${{ matrix.shard }}/6 — ${#files[@]} files"
          node --disable-warning=ExperimentalWarning --import ./test/setup.ts --test "${files[@]}"