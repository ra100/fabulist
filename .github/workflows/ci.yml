name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:web

  # Six runners, each running its share of `test/*.test.ts` through
  # `test/run.ts`: the files are dealt out by recorded cost (`test/timings.json`)
  # so the expensive `pg-*` files are spread evenly, and within a runner they run
  # in one long-lived process per vCPU (`--test-isolation=none`) rather than one
  # process per file, which used to re-load the app's module graph ~100 times.
  # Nothing is skipped and nothing is excluded: the six shards together are
  # exactly the files listed here.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fabulist_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fabulist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FABULIST_TEST_PG: postgres://postgres:postgres@127.0.0.1:5432/fabulist_test
      FABULIST_REQUIRE_TEST_PG: '1'
      FABULIST_TEST_PG_SCALE: '1'
      # Each test process compiles the same TypeScript module graph; the compile
      # cache is shared by all of them. Kept out of the repo — the runner is
      # thrown away afterwards.
      NODE_COMPILE_CACHE: /tmp/fabulist-node-compile-cache
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # This Postgres is created for one run and thrown away, so durability buys
      # the suite nothing. `withPg` builds a fresh throwaway schema per test, so
      # the WAL sync settings are on the hot path for hundreds of create/drop
      # cycles. All three are `sighup`/`user` settings, so `ALTER SYSTEM` plus a
      # reload applies them to the running server without restarting it. Nothing
      # observable changes: same rows, same queries, same assertions.
      - name: turn off WAL sync for the throwaway test database
        run: |
          set -euo pipefail
          psql "$FABULIST_TEST_PG" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER SYSTEM SET fsync = off;
          ALTER SYSTEM SET full_page_writes = off;
          ALTER SYSTEM SET synchronous_commit = off;
          SELECT pg_reload_conf();
          SQL
          psql "$FABULIST_TEST_PG" -Atc \
            "SELECT name || '=' || setting FROM pg_settings WHERE name IN ('fsync','full_page_writes','synchronous_commit') ORDER BY name"

      - name: run test shard ${{ matrix.shard }}/6
        run: node test/run.ts --shard=${{ matrix.shard }}/6 test/*.test.ts
