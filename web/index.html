<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fabulist</title>

    <!--
      Two drawings, not one. favicon.svg is the ≤48px tier — the nib alone, no page and no
      ruled edge, because below 64px the paragraph stops reading as text and becomes a grey
      slab. icon.svg is the master and serves 96px upward. The measurements behind that
      split are in .design/brand/README.md; both files are generated by
      .design/brand/marginalia.py.

      The icon carries its own colour rather than following the palette picker — nine
      presets cannot share one favicon — so this is the one place a Chronicle value ships
      outside the generated token blocks.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c0a07" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
