<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fabulist</title>

    <!--
      One drawing, at every size. The mark is the nib rotated 45° and cropped by the tile's
      own corner, which is the only composition here whose structure survives downsampling:
      what a raster pipeline preserves is large high-contrast areas, and this is nothing but
      one. Everything with fine detail — a page of ruled lines, a hairline rule, a thin nib —
      collapsed by 32px and needed a size-specific sibling to cover for it. This needs none,
      so there is no tier boundary to police and no chance of the wrong file at the wrong
      size. Rasters below are generated from the same SVG; see .design/brand/README.md.

      The icon carries its own colour rather than following the palette picker — nine presets
      cannot share one favicon — so this is the one place a Chronicle value ships outside the
      generated token blocks.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c0a07" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
