allowBuilds:
  esbuild: true

# Vite needs esbuild's native binary, so its build script must be approved.
onlyBuiltDependencies:
  - esbuild

# pnpm runs `install` before every script and treats the ignored-build notice as
# a hard failure, which blocks `pnpm test` even when the dependency tree is
# complete and working. The deps here are plain and checked into a lockfile, so
# the pre-run verification buys nothing.
verifyDepsBeforeRun: false
