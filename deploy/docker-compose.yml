services:
  fabulist:
    image: ra100/fabulist:latest
    container_name: fabulist
    restart: unless-stopped
    # Runtime config rendered by CI from repo secrets/variables and uploaded
    # alongside this file — see deploy/deploy.sh and
    # .github/workflows/release.yml. Carries real secrets now (WORKOS_API_KEY,
    # WORKOS_COOKIE_PASSWORD for the web login feature), not just public
    # config — `required: false` is still correct (a first-ever
    # `docker compose up` before that upload has run boots with both /mcp and
    # login simply not mounted — buildMcpAuth()/resolveAuthConfig() both
    # return null on missing env), it just means this file is more sensitive
    # than its name suggests: never commit a real app.env, and treat the
    # VPS's own copy with the same care as any secrets file. Compose already
    # recreates the container whenever this file's *contents* change, even
    # though the filename itself never does — no extra restart logic needed
    # here for a config update to take effect.
    env_file:
      - path: app.env
        required: false
    environment:
      # The database URL, defaulted to the bundled Postgres.
      #
      # `${FABULIST_PG:-...}` rather than a bare default, so `app.env`'s own value
      # still wins — env_file is loaded first and `environment:` would otherwise
      # override it. Compose resolves `${...}` from the shell and `.env`, not from
      # `env_file`, which is exactly the interaction that makes this work: the
      # substitution only applies when nothing else set it.
      #
      # This is what makes `--profile bundled` need no configuration at all. It also
      # means a plain `docker compose up` with *no* FABULIST_PG anywhere points at a
      # `postgres` host that does not exist, and the app says so at boot in one line
      # — better than defaulting to `localhost`, which inside a container is the
      # container itself and produces the same failure with a more confusing message.
      FABULIST_PG: ${FABULIST_PG:-postgres://fabulist:${POSTGRES_PASSWORD:-fabulist-local}@postgres:5432/fabulist}
    # 127.0.0.1 only, never 0.0.0.0: nginx is the sole public listener (see
    # deploy/nginx/fabulist.conf), and the container's own bind-all is only
    # for reachability *inside* the container network, not a reason to also
    # publish it on every host interface.
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      # Bind mount, not a named volume: a named volume's backing directory
      # sits under Docker's own storage path (typically
      # /var/lib/docker/volumes/<name>/_data), root-owned and considered an
      # implementation detail Docker does not promise to keep stable across
      # versions — getting a file in or out means `docker cp`, never a plain
      # `scp`/`rsync` to a host path. A bind mount is an ordinary directory
      # on the VPS's own disk instead: `scp`, `rsync`, `ls`, a cron backup
      # job, all work on it directly, no `docker` invocation needed. The
      # container still writes node:sqlite's WAL-mode files here exactly as
      # before via --data-root=/data — nothing about that changes. Do not
      # `cp` a *world* file while the container is running regardless of
      # which volume type this is — see the README's "Copying a save"
      # section for why; that hazard is about the app's own open database
      # handle, not about Docker's volume plumbing.
      #
      # ${FABULIST_DATA_DIR:-./fabulist-data}: a relative default so this
      # file discloses no real host path. Compose resolves a relative bind
      # source against *this compose file's own directory*
      # (`deploy/fabulist-data` wherever this file actually lives on the
      # VPS — confirmed against Compose's own docs, not assumed), so the
      # committed default never needs to name the operator's real layout.
      # Override by exporting FABULIST_DATA_DIR before `docker compose up`,
      # or by adding it to app.env (which `env_file` already loads) if an
      # absolute path elsewhere on the disk is preferred.
      #
      # The container runs as root (no USER in the Dockerfile), so files
      # written here are root-owned on the host. `sudo` to browse/copy
      # directly, or keep using `docker cp` if that's inconvenient — both
      # still work.
      - ${FABULIST_DATA_DIR:-./fabulist-data}:/data
    healthcheck:
      # Any HTTP response below 500 counts as healthy, not just 200. What this
      # needs to answer is "is the process up and serving HTTP", and with
      # AUTH_REQUIRE_LOGIN=true (v0.2.4) every /api/ route including
      # /api/meta correctly returns 401 to an unauthenticated caller — the
      # session gate in src/server/api.ts sits ahead of them by design. The
      # original `statusCode === 200` check therefore marked a perfectly
      # healthy container unhealthy from the moment login was switched on.
      # Caught by booting the released image with production-shaped env and
      # watching /api/meta return 401, not by reading the file.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4317/api/meta', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 120s, not 10s: the first boot after the Postgres migration imports every
      # existing SQLite world before it starts listening, and that is real work —
      # measured 9.5s for the three worlds on the reference machine (45,034 canon
      # entities, 226,347 canon edges), so an instance with twenty would take
      # proportionally longer. `start_period` failures do not count toward
      # `retries`, so a generous value costs nothing on an ordinary boot (the
      # check still runs every 30s and the container is marked healthy as soon as
      # one passes) and prevents a slow one-time import from being reported as a
      # failing container.
      #
      # This does not gate `restart: unless-stopped`, which reacts to the process
      # exiting rather than to health — the importer is written so a failed world
      # never crashes the process for exactly that reason (see
      # src/db/import-sqlite.ts). Prefer running `pnpm import-pg` as a deploy
      # step when the import is expected to be long, so it happens while nothing
      # is serving.
      start_period: 120s

    # Reaches a *host* Postgres by name. Container `localhost` is the container's
    # own network namespace, so a host service is not there — `host-gateway`
    # resolves to the address the host presents on the Docker bridge, which is what
    # `FABULIST_PG=...@host.docker.internal:5432/...` then points at. Harmless when
    # the bundled Postgres is used instead; it is one extra hosts entry nothing
    # looks up.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Waits for the bundled Postgres *when there is one*.
    #
    # `required: false` is what makes the two deployment modes one file: without the
    # `bundled` profile the `postgres` service does not exist, and a plain
    # `depends_on` would then refuse to start the app at all. With the profile on,
    # this still waits for `service_healthy` rather than `service_started` — the
    # Postgres entrypoint runs an initdb and an internal restart on first boot, so
    # the port is listening well before it will answer, and racing it makes the app
    # exit on a perfectly healthy cold start.
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # The bundled Postgres: off unless asked for.
  #
  #     docker compose up -d                      -> your own Postgres, via FABULIST_PG
  #     docker compose --profile bundled up -d     -> this one, created automatically
  #
  # A profile rather than a second compose file, so there is one file to read and no
  # chance of the two drifting. The deployed VPS uses its existing Postgres (the
  # database and role created by hand once); a local `--profile bundled` run needs
  # nothing but Docker, which is the point — `POSTGRES_DB`/`POSTGRES_USER` below make
  # the entrypoint create both on an empty volume.
  postgres:
    profiles: ["bundled"]
    # Pinned to a major version, not `latest`: a Postgres major upgrade needs
    # pg_upgrade or a dump/restore, so silently moving between them on a
    # `docker compose pull` would leave the container unable to open its own data
    # directory. 18 is what the schema was developed and load-tested against.
    image: postgres:18-alpine
    container_name: fabulist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fabulist
      POSTGRES_USER: fabulist
      # Defaulted, deliberately, and only safe because of the two lines below it:
      # this service publishes no ports, so the database is reachable only from the
      # compose network. A local `--profile bundled` run should need nothing but
      # Docker — demanding a password to try the app on a laptop is the kind of
      # friction that gets worked around with a worse password.
      #
      # Set POSTGRES_PASSWORD in app.env for anything not on a laptop. The deployed
      # instance does not use this service at all.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fabulist-local}
    # Sized for a small server, not for the load ceiling.
    #
    # Measured on this schema, with the app's default pools (4 play + 2 ingest):
    # an idle container is 20 MB and a busy one about 32 MB. `max_connections=50`
    # is ~8x the app's peak, leaving room for a psql session and a backup job; the
    # setting itself costs little, but every *open* connection is a Postgres process
    # at ~1.8 MB, which is why the app's pool defaults matter more than this number.
    #
    # `shared_buffers=64MB` rather than the 128MB default: this schema's hot set is
    # small (the whole 20-world load-test database was 120 MB on disk) and the OS page
    # cache does the rest. Raise both, along with FABULIST_PG_POOL, for an instance
    # with real concurrent load — the 100-user load test ran 20 play connections
    # against max_connections=300, and the default of 100 genuinely *aborts* there
    # with `FATAL: sorry, too many clients already` rather than degrading.
    command: postgres -c max_connections=50 -c shared_buffers=64MB
    # A hard ceiling, so a runaway query cannot starve the app container on a small
    # box. Generous against the ~32 MB measured above; Postgres will not use it.
    deploy:
      resources:
        limits:
          memory: 256M
    # Deliberately not published to the host at all: only the app needs to reach
    # it, and it does so over the compose network by service name. An operator
    # wanting psql uses `docker compose exec postgres psql -U fabulist`.
    volumes:
      # A bind mount for the same reasons the app's /data is one — an ordinary
      # host directory that rsync, a cron backup and `ls` all work on, rather
      # than a root-owned path under Docker's own storage that only `docker cp`
      # can reach. Back this up with `pg_dump`, not by copying the directory
      # while the server is running.
      #
      # `/var/lib/postgresql`, *not* `/var/lib/postgresql/data`. The 18 images
      # changed this: they store data in a major-version subdirectory so
      # `pg_upgrade --link` works without crossing a mount boundary, and mounting at
      # the old `/data` path makes the entrypoint refuse to start with "there appears
      # to be PostgreSQL data in /var/lib/postgresql/data (unused mount/volume)".
      # Found by actually running it — the pre-18 path is still what most examples
      # show, and it fails at boot rather than at build.
      - ${FABULIST_PG_DIR:-./fabulist-pg}:/var/lib/postgresql
    healthcheck:
      # `pg_isready` against the app's own database and user, not the defaults:
      # `pg_isready` with no arguments succeeds as soon as the *server* is up,
      # which on first boot is true before initdb has created this database.
      test: ["CMD-SHELL", "pg_isready -U fabulist -d fabulist"]
      interval: 10s
      timeout: 5s
      retries: 5
      # initdb plus the entrypoint's own restart takes a few seconds on a cold
      # volume; failures here do not count toward `retries`.
      start_period: 30s

