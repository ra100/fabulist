services:
  fabulist:
    image: ra100/fabulist:latest
    container_name: fabulist
    restart: unless-stopped
    # Non-secret runtime config (MCP_OAUTH_ISSUER etc.) rendered by CI from
    # repo variables and uploaded alongside this file — see deploy/deploy.sh
    # and .github/workflows/release.yml. `required: false` so a first-ever
    # `docker compose up` before that upload has run doesn't fail outright:
    # the app boots with /mcp simply not mounted (buildMcpAuth() returns null
    # on missing env — src/mcp/auth.ts), same as any other under-configured
    # profile. Compose already recreates the container whenever this file's
    # *contents* change, even though the filename itself never does — no
    # extra restart logic needed here for a config update to take effect.
    env_file:
      - path: app.env
        required: false
    # 127.0.0.1 only, never 0.0.0.0: nginx is the sole public listener (see
    # deploy/nginx/fabulist.conf), and the container's own bind-all is only
    # for reachability *inside* the container network, not a reason to also
    # publish it on every host interface.
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      # Named volume, not a bind mount: this app's node:sqlite files are WAL
      # mode (see Dockerfile's own comment on this) and the volume is the
      # thing docker-fix (be4819f/v0.1.1) actually persists worlds into via
      # --data-root=/data. Do not `cp` this while the container is running —
      # see the README's "Copying a save" section for why.
      - fabulist-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4317/api/meta', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  fabulist-data:
    name: fabulist-data
