services:
  fabulist:
    image: ra100/fabulist:latest
    container_name: fabulist
    restart: unless-stopped
    # Runtime config rendered by CI from repo secrets/variables and uploaded
    # alongside this file — see deploy/deploy.sh and
    # .github/workflows/release.yml. Carries real secrets now (WORKOS_API_KEY,
    # WORKOS_COOKIE_PASSWORD for the web login feature), not just public
    # config — `required: false` is still correct (a first-ever
    # `docker compose up` before that upload has run boots with both /mcp and
    # login simply not mounted — buildMcpAuth()/resolveAuthConfig() both
    # return null on missing env), it just means this file is more sensitive
    # than its name suggests: never commit a real app.env, and treat the
    # VPS's own copy with the same care as any secrets file. Compose already
    # recreates the container whenever this file's *contents* change, even
    # though the filename itself never does — no extra restart logic needed
    # here for a config update to take effect.
    env_file:
      - path: app.env
        required: false
    # 127.0.0.1 only, never 0.0.0.0: nginx is the sole public listener (see
    # deploy/nginx/fabulist.conf), and the container's own bind-all is only
    # for reachability *inside* the container network, not a reason to also
    # publish it on every host interface.
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      # Named volume, not a bind mount: this app's node:sqlite files are WAL
      # mode (see Dockerfile's own comment on this) and the volume is the
      # thing docker-fix (be4819f/v0.1.1) actually persists worlds into via
      # --data-root=/data. Do not `cp` this while the container is running —
      # see the README's "Copying a save" section for why.
      - fabulist-data:/data
    healthcheck:
      # Any HTTP response below 500 counts as healthy, not just 200. What this
      # needs to answer is "is the process up and serving HTTP", and with
      # AUTH_REQUIRE_LOGIN=true (v0.2.4) every /api/ route including
      # /api/meta correctly returns 401 to an unauthenticated caller — the
      # session gate in src/server/api.ts sits ahead of them by design. The
      # original `statusCode === 200` check therefore marked a perfectly
      # healthy container unhealthy from the moment login was switched on.
      # Caught by booting the released image with production-shaped env and
      # watching /api/meta return 401, not by reading the file.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4317/api/meta', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  fabulist-data:
    name: fabulist-data
