# nginx server block for fabulist.rast.io
#
# Scope decision (see the chat that produced this file): the app
# (src/server/api.ts) has zero request-level authentication anywhere — every
# one of its ~60 routes trusts whoever can reach it. This is deliberately a
# *private* deployment: nginx is the only thing standing between the public
# internet and a fully unauthenticated world-editing API, enforced here by an
# IP allowlist, not by anything the app itself does.
#
# Replace every "CHANGE-ME" IP below with your actual allowed source
# addresses before this goes live. `curl -4 ifconfig.me` from the network you
# play from gets you the IP to add.
#
# Install path (Ubuntu, nginx from apt):
#   sudo cp deploy/nginx/fabulist.conf /etc/nginx/sites-available/fabulist.rast.io
#   sudo ln -s /etc/nginx/sites-available/fabulist.rast.io /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fabulist.rast.io   # obtains the cert, rewrites the
#                                               # server block below to add the
#                                               # `listen 443 ssl` + cert lines
#                                               # and an HTTP->HTTPS redirect

server {
    listen 80;
    listen [::]:80;
    server_name fabulist.rast.io;

    # certbot's --nginx mode inserts the 443/TLS block and the redirect to it
    # here on first run. Until certbot has run once, this plain-80 block is
    # what actually serves traffic — the allowlist below still applies to it.

    # --- IP allowlist ---------------------------------------------------
    # Every `allow` line is a source you trust; `deny all` is the default for
    # everyone else. Order matters: nginx evaluates top to bottom and stops
    # at the first match.
    allow 127.0.0.1;             # nginx -> app health checks, local curl
    allow CHANGE-ME-YOUR-IP-1;   # e.g. home network
    allow CHANGE-ME-YOUR-IP-2;   # e.g. office / mobile hotspot
    deny all;

    # --- SSE (streamed narration) ---------------------------------------
    # src/server/api.ts sends `content-type: text/event-stream` for
    # narration. Buffering or chunking that defeats the entire point of
    # streaming — prose would arrive in bursts instead of live.
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;   # a long narration/session should not be cut

    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Not an Upgrade/WebSocket proxy: this app's streaming is plain SSE
        # over a normal HTTP response, not a websocket, so no
        # `proxy_set_header Upgrade`/`Connection "upgrade"` pair is needed.
    }
}
