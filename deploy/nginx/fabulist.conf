# Reference reverse-proxy server block for fabulist.rast.io — NOT
# necessarily the config actually live on the VPS. The operator manages
# openresty's real config directly; this file exists as a starting point /
# record of the SSE-safe settings this app needs, not as something CI or any
# script here uploads or reconciles against the running server.
#
# Written for openresty (the VPS's existing front door for other sites too),
# not a separate nginx install. openresty's directive syntax is nginx's, so
# this file is plain nginx config — if used, it'd be dropped wherever
# openresty includes server blocks from (check the `include` lines inside
# its main nginx.conf — commonly a conf.d/sites-enabled directory) rather
# than a Debian-nginx-package sites-available directory.
#
# Scope note (see the conversation that produced this file): the REST API
# (src/server/api.ts) has zero request-level authentication anywhere — every
# one of its ~60 routes trusts whoever can reach it. `/mcp` is different: it
# has its own bearer-token check (src/mcp/auth.ts). This reference config
# still gates everything behind an IP allowlist below — loosen it only if you
# specifically intend to expose `/mcp` to remote OAuth-authenticated clients,
# and only for that path.
#
# Replace every "CHANGE-ME" IP below with your actual allowed source
# addresses before this goes live. `curl -4 ifconfig.me` from the network you
# play from gets you the IP to add.
#
# TLS: a *.rast.io wildcard cert issued via certbot-dns-websupport (DNS-01,
# not HTTP-01 — wildcards can't use HTTP-01 at all) into a dedicated venv at
# /opt/certbot-venv, kept separate from this box's apt certbot so neither
# install's dependencies conflict with the other's. Renewed by a
# `/opt/certbot-venv/bin/certbot renew --cert-name rast.io ...` line in
# /etc/cron.d/certbot alongside the existing entries there — this file
# doesn't manage that, it just points at the resulting cert files below.
#
# --- Baseline security headers (issue #25) --------------------------------
#
# Content-Security-Policy is scoped to what the built frontend (`web/`)
# actually loads, not a generic template:
#   - `script-src 'self'` — every script is a hashed Vite bundle served from
#     this origin (`web/index.html`/`landing.html` both use
#     `<script type="module" src="/...">`, never an inline `<script>` block),
#     so no `'unsafe-inline'`/nonce is needed here, unlike style below.
#   - `style-src ... 'unsafe-inline' https://fonts.googleapis.com` — the
#     landing page pulls its type from Google Fonts via a `<link>` (see
#     `web/landing.html`'s `fonts.googleapis.com/css2?family=...`), and
#     several app views (e.g. the causality/timeline graph views) position
#     nodes with a React `style={{...}}` attribute rather than a class,
#     which CSP treats as inline style absent a separate `style-src-attr`.
#     `'unsafe-inline'` is scoped to `style-src` only — it does not relax
#     `script-src`, so it cannot itself enable script execution.
#   - `font-src ... https://fonts.gstatic.com` — where that Google Fonts CSS
#     actually hosts the `@font-face` files it declares.
#   - `img-src 'self' data:` — favicon/illustrations are same-origin;
#     `web/src/styles.css` also has a couple of small inline `data:` images.
#   - `connect-src 'self'` — the app's own `fetch`/SSE calls (narration
#     streaming, `/api/*`) never leave this origin; WorkOS login is a
#     `302` redirect to a full top-level navigation
#     (`web/src/landing/Landing.tsx`'s `<a href="/auth/login">`), which CSP's
#     `connect-src` does not govern.
#   - `frame-ancestors 'none'` is the CSP-native, modern replacement for
#     `X-Frame-Options: DENY` (kept alongside it for browsers that only
#     honor the older header) — nothing here is meant to be iframed, so
#     both close the clickjacking gap the same way.
#   - `object-src 'none'` and `base-uri 'self'` remove two directives this
#     app has no legitimate use for (Flash/plugin embeds, a page rewriting
#     its own `<base>`) at effectively zero functional cost.
#   - No `report-uri`/`report-to` here on purpose: wiring one up needs a
#     collector this reference config does not stand up. Before loosening
#     any directive above because something in a real deployment breaks,
#     check the browser console first — CSP violations are logged there
#     even with no reporting endpoint configured.
#
# Strict-Transport-Security is deliberately **commented out below** rather
# than shipped live: HSTS is a one-way door per browser (it cannot be
# un-sent once a browser has cached it for `max-age`, short of the user
# manually clearing HSTS state), so turning it on is a decision for whoever
# actually runs this config, not something this reference file should do
# silently. Documented rollout, in order:
#   1. Confirm TLS actually terminates cleanly for every subdomain you serve
#      (or omit `includeSubDomains` if you're not sure) — HSTS applies to
#      the whole browser, this domain, for `max-age` seconds, regardless of
#      which `server{}` block answered.
#   2. Start with a short `max-age` (the `300` below is 5 minutes) and watch
#      for broken HTTP fallback before raising it.
#   3. Raise `max-age` in steps (e.g. a day, then a week, then the
#      `31536000` = 1 year commonly recommended) once step 2 has been clean
#      for at least that long a window.
#   4. Only add `preload` after sitting at the 1-year `max-age` with
#      `includeSubDomains` for a while — HSTS preload lists are slow to
#      reverse if this domain's TLS setup ever changes.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fabulist.rast.io;

    ssl_certificate     /etc/letsencrypt/live/rast.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rast.io/privkey.pem;

    # add_header Strict-Transport-Security "max-age=300" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # openresty's own default (1M) is far below a world file — the largest
    # real one seen in development (a multi-wiki Star Trek ingest) is ~64 MB
    # — so `POST /api/worlds/:slug/upload` (src/server/api.ts) 413'd here,
    # never reaching the app at all. Confirmed directly against the live
    # server: a tiny POST to that route got a normal 401 from the app, the
    # real ~27 MB file got `413 Request Entity Too Large` with openresty's
    # own HTML error page (`Server: HAL9000`, `Content-Type: text/html`,
    # never JSON) before the app ever saw it. Over HTTP/2 a mid-upload 413
    # surfaces client-side as `ERR_HTTP2_PROTOCOL_ERROR` rather than a clean
    # status the browser can show, which is what made this look like the
    # app itself broke. 100M leaves headroom above the app's own 512 MB
    # route-level cap while comfortably covering real worlds today; raise
    # both together if a bigger one ever needs it.
    client_max_body_size 100M;

    # --- IP allowlist ---------------------------------------------------
    # Every `allow` line is a source you trust; `deny all` is the default for
    # everyone else. Order matters: nginx/openresty evaluates top to bottom
    # and stops at the first match.
    allow 127.0.0.1;             # local curl / health checks
    allow CHANGE-ME-YOUR-IP-1;   # e.g. home network
    allow CHANGE-ME-YOUR-IP-2;   # e.g. office / mobile hotspot
    deny all;

    # --- SSE (streamed narration) ---------------------------------------
    # src/server/api.ts sends `content-type: text/event-stream` for
    # narration. Buffering or chunking that defeats the entire point of
    # streaming — prose would arrive in bursts instead of live.
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;   # a long narration/session should not be cut

    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Not an Upgrade/WebSocket proxy: this app's streaming is plain SSE
        # over a normal HTTP response, not a websocket, so no
        # `proxy_set_header Upgrade`/`Connection "upgrade"` pair is needed.
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name fabulist.rast.io;
    return 301 https://$host$request_uri;
}
