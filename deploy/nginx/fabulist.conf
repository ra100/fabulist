# Reference reverse-proxy server block for fabulist.rast.io — NOT
# necessarily the config actually live on the VPS. The operator manages
# openresty's real config directly; this file exists as a starting point /
# record of the SSE-safe settings this app needs, not as something CI or any
# script here uploads or reconciles against the running server.
#
# Written for openresty (the VPS's existing front door for other sites too),
# not a separate nginx install. openresty's directive syntax is nginx's, so
# this file is plain nginx config — if used, it'd be dropped wherever
# openresty includes server blocks from (check the `include` lines inside
# its main nginx.conf — commonly a conf.d/sites-enabled directory) rather
# than a Debian-nginx-package sites-available directory.
#
# Scope note (see the conversation that produced this file): the REST API
# (src/server/api.ts) has zero request-level authentication anywhere — every
# one of its ~60 routes trusts whoever can reach it. `/mcp` is different: it
# has its own bearer-token check (src/mcp/auth.ts). This reference config
# still gates everything behind an IP allowlist below — loosen it only if you
# specifically intend to expose `/mcp` to remote OAuth-authenticated clients,
# and only for that path.
#
# Replace every "CHANGE-ME" IP below with your actual allowed source
# addresses before this goes live. `curl -4 ifconfig.me` from the network you
# play from gets you the IP to add.
#
# TLS: a *.rast.io wildcard cert issued via certbot-dns-websupport (DNS-01,
# not HTTP-01 — wildcards can't use HTTP-01 at all) into a dedicated venv at
# /opt/certbot-venv, kept separate from this box's apt certbot so neither
# install's dependencies conflict with the other's. Renewed by a
# `/opt/certbot-venv/bin/certbot renew --cert-name rast.io ...` line in
# /etc/cron.d/certbot alongside the existing entries there — this file
# doesn't manage that, it just points at the resulting cert files below.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fabulist.rast.io;

    ssl_certificate     /etc/letsencrypt/live/rast.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rast.io/privkey.pem;

    # --- IP allowlist ---------------------------------------------------
    # Every `allow` line is a source you trust; `deny all` is the default for
    # everyone else. Order matters: nginx/openresty evaluates top to bottom
    # and stops at the first match.
    allow 127.0.0.1;             # local curl / health checks
    allow CHANGE-ME-YOUR-IP-1;   # e.g. home network
    allow CHANGE-ME-YOUR-IP-2;   # e.g. office / mobile hotspot
    deny all;

    # --- SSE (streamed narration) ---------------------------------------
    # src/server/api.ts sends `content-type: text/event-stream` for
    # narration. Buffering or chunking that defeats the entire point of
    # streaming — prose would arrive in bursts instead of live.
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;   # a long narration/session should not be cut

    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Not an Upgrade/WebSocket proxy: this app's streaming is plain SSE
        # over a normal HTTP response, not a websocket, so no
        # `proxy_set_header Upgrade`/`Connection "upgrade"` pair is needed.
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name fabulist.rast.io;
    return 301 https://$host$request_uri;
}
